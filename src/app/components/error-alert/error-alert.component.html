<div role="alert" class="alert alert-error items-start mt-3">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>
  <div class="min-w-0 flex-1">
    <h3 class="font-bold">Error</h3>
    @if (errorDetails) {
      <details class="mt-1">
        <summary class="cursor-pointer text-xs select-none">Show details</summary>
        <p class="mt-1 text-xs break-words">{{ errorDetails }}</p>
      </details>
    }
  </div>
</div>
