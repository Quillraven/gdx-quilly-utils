<div class="drop-zone mt-2 flex min-h-48 items-center justify-center rounded-box border border-base-300 bg-base-100 p-3"
     [class.drop-zone-empty]="empty"
     [class.drop-zone-active]="dragActive()"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)">
  @if (!empty && dragActive()) {
    <div class="drop-zone-overlay">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="h-8 w-8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
      </svg>
      <p class="mt-2 text-sm font-medium">{{ overlayText }}</p>
    </div>
  }

  @if (empty) {
    <div class="pointer-events-none flex flex-col items-center gap-2 text-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="h-10 w-10 text-base-content/50">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z"/>
      </svg>
      <p class="text-sm font-medium text-base-content/70">{{ dropTitle }}</p>
      <p class="text-sm text-base-content/50">{{ dropHint }}</p>
    </div>
  } @else {
    <ng-content></ng-content>
  }
</div>
