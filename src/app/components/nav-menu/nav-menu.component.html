<div class="navbar-start flex min-w-0 flex-1 items-center gap-1 sm:gap-2">
  <details class="dropdown md:hidden" #navMenu>
    <summary class="btn btn-ghost btn-square" aria-label="Open navigation menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/>
      </svg>
    </summary>
    <ul class="menu dropdown-content z-10 mt-2 w-60 rounded-box bg-base-100 p-2 text-base-content shadow"
        aria-label="Mobile navigation">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            (click)="closeMenu()"
            routerLinkActive="bg-primary text-primary-content"
            [routerLinkActiveOptions]="{exact: item.exact}"
          >{{ item.label }}</a>
        </li>
      }
    </ul>
  </details>

  <a routerLink="/"
     class="brand-link min-w-0 truncate text-lg font-bold hover:underline hover:underline-offset-4 sm:text-xl"
     aria-label="Quilly's GDX Utilities, back to home">
    Quilly's GDX Utilities
  </a>

  <ul class="menu menu-horizontal hidden flex-none gap-1 px-1 md:flex"
      aria-label="Main navigation">
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          class="rounded-md px-3 py-2 text-sm font-medium hover:bg-primary-content/10"
          routerLinkActive="bg-primary-content font-semibold text-primary hover:bg-primary-content"
          [routerLinkActiveOptions]="{exact: item.exact}"
        >{{ item.label }}</a>
      </li>
    }
  </ul>
</div>
